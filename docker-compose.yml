# Práctica de reverse proxy: nginx en el puerto 80 reparte las peticiones entre los servicios.
#
#   docker compose up -d                       ← siempre desde esta carpeta
#     http://localhost/              → portal (proxy/web/)
#     http://localhost/code/         → code-server
#     http://localhost/portainer/    → Portainer
#
# Solo el proxy publica un puerto ("ports"). El resto de servicios no son accesibles desde fuera:
# se llega a ellos a través del proxy, que los encuentra por su nombre de servicio (code, portainer…).

services:
  proxy:                        # reverse proxy + portal
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"                 # ¿Puerto 80 ocupado en tu PC? Usa otro: "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # la configuración

  web-publica:                       # → /mi-web/
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./cimientospro.local:/usr/share/nginx/html:ro

  intranet:
    image: nginx:alpine              
    restart: unless-stopped
    volumes:
      - ./intranet.cimientospro.local:/usr/share/nginx/html:ro

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # requisito: socket de Docker
      - portainer_data:/data

  code:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PASSWORD=${CODE_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - .:/config/workspace     # bind mount: lo que edites se ve al instante
      - code_config:/config

  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    restart: unless-stopped
    environment:
      - PUID=0                           # root para poder leer el volumen de Portainer
      - PGID=0
      - TZ=${TZ}
      - SETTINGS_ENCRYPTION_KEY=${DUPLICATI_ENCRYPTION_KEY}
      - DUPLICATI__WEBSERVICE_PASSWORD=${DUPLICATI_WEBUI_PASSWORD}
      - CLI_ARGS=--webservice-interface=any --webservice-allowed-hostnames=*
    volumes:
      - duplicati_config:/config
      - .:/source   # origen 1: web de la intranet

  kuma:                                  # servicio elegido: Uptime Kuma
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data

volumes:
  portainer_data:
  code_config:
  duplicati_config:
  kuma_data: