# Reverse proxy: recibe TODO el tráfico del puerto 80 y lo reparte entre los servicios.
# Hay dos formas de repartirlo (se pueden combinar):
#   - Por RUTA:      http://localhost/code/        → mira el principio de la URL  (location)
#   - Por SUBDOMINIO: http://code.localhost/       → mira el nombre pedido        (server_name)
#
# Este fichero, tal como viene, publica por ruta:
#   /             → portal: los archivos de proxy/web/
#   /code/        → servicio "code"      (code-server, puerto 8443)
#   /portainer/   → servicio "portainer" (Portainer, puerto 9000)
# Para añadir un servicio, copia uno de los bloques de abajo cambiando la ruta (o el nombre) y el destino.
# Después de cambiar este fichero: docker compose restart proxy

# DNS interno de Docker. Como cada location pone el servicio en una variable ($destino), nginx lo
# busca en cada petición (guardando la respuesta 10 s) en vez de una sola vez al arrancar. Así:
#   - el proxy arranca aunque algún servicio esté parado o mal escrito (esa ruta da 502), y
#   - si un contenedor se recrea (y cambia de IP), el proxy lo encuentra solo.
# DNS interno de Docker
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSockets para code-server
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cabeceras heredadas para todos los servicios
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix $prefijo;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
client_max_body_size 50m;

# =====================================================================================
# SERVIDOR PRINCIPAL: Web Pública (cimientospro.local y www.cimientospro.local)
# =====================================================================================
server {
    listen 80 default_server;
    server_name cimientospro.local www.cimientospro.local;
    set $prefijo "";           
    absolute_redirect off;

    location / {
        set $destino web-publica:80;
        proxy_pass http://$destino;
    }
}

# =====================================================================================
# SERVICIOS POR SUBDOMINIO
# =====================================================================================

# Intranet
server {
    listen 80;
    server_name intranet.cimientospro.local;
    set $prefijo "";
    absolute_redirect off;

    location / {
        set $destino intranet:80;
        proxy_pass http://$destino;
    }
}  

# Portainer
server {
    listen 80;
    server_name portainer.cimientospro.local;
    set $prefijo "";
    
    location / {
        set $destino portainer:9000;
        proxy_pass http://$destino;
    }
}

# Code-Server
server {
    listen 80;
    server_name code.cimientospro.local;
    set $prefijo "";
    
    location / {
        set $destino code:8443;
        proxy_pass http://$destino;
    }
}

# Duplicati
server {
    listen 80;
    server_name duplicati.cimientospro.local;
    set $prefijo "";
    
    location / {
        set $destino duplicati:8200;
        proxy_pass http://$destino;
    }
}

# Uptime Kuma
server {
    listen 80;
    server_name kuma.cimientospro.local;
